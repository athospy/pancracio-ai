services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      # Loopback only — deliberately different from job-finder's "5678:5678".
      # n8n here only needs to run schedules and make outbound calls (to the
      # tracker, OpenAI, Anthropic, Instagram); nothing needs to reach it from
      # outside this VPS, so it's never publicly bound. Reach it via
      # `ssh -L 5678:localhost:5678 <render-vps-alias>`.
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Chicago
      - TZ=America/Chicago
      # n8n defaults to requiring HTTPS for cookies; we're only ever
      # reaching this over http://localhost (via the SSH tunnel above), so relax that.
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
