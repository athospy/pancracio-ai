<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pancracio 3D</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #f5f5f5;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100%;
    }

    h1 {
      margin-top: 32px;
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    model-viewer {
      width: min(100vw, 800px);
      height: min(70vh, 640px);
      background: transparent;
      --poster-color: transparent;
      cursor: grab;
    }
    model-viewer:active { cursor: grabbing; }

    .ar-button {
      appearance: none;
      border: 1px solid #1a1a1a;
      background: #1a1a1a;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 11px 24px;
      border-radius: 999px;
      cursor: pointer;
    }
    .ar-button:hover { background: #333; }

    footer {
      margin-top: auto;
      padding: 20px;
      font-size: 0.8rem;
      color: #999;
    }
  </style>
</head>
<body>
  <h1>Pancracio 3D</h1>

  <model-viewer
    src="pancracio.glb"
    ios-src="pancracio.usdz"
    alt="Pancracio 3D model"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="20deg"
    interaction-prompt="none"
    shadow-intensity="1"
    shadow-softness="0.8"
    exposure="1.1"
    environment-image="neutral"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    touch-action="pan-y">

    <button slot="ar-button" class="ar-button">View in AR</button>
  </model-viewer>

  <footer>Drag to rotate &middot; open on iPhone for AR</footer>
</body>
</html>
