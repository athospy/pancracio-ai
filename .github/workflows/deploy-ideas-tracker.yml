name: Deploy Ideas Tracker

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-ideas-tracker.yml"
  workflow_dispatch:

concurrency:
  group: pancracio-ideas-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Sync App and Restart Service
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure known hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync app source to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az \
            --exclude ".DS_Store" \
            --exclude "venv/" \
            --exclude "__pycache__/" \
            --exclude "pancracio.db" \
            --exclude "static/uploads/" \
            -e "ssh -p $SSH_PORT" \
            ./web/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Install dependencies and restart service
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            cd '$DEPLOY_PATH' &&
            venv/bin/pip install -q -r requirements.txt &&
            sudo systemctl restart pancracio-ai.service
          "

      - name: Verify deployment
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          sleep 2
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "sudo systemctl status pancracio-ai.service | grep -q 'active (running)'"
