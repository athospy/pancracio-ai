{% extends "base.html" %}
{% block title %}Log in — Pancracio Ideas{% endblock %}
{% block content %}

<div class="login-page">
  <h1>Log in</h1>
  <form id="login-form" class="idea-form">
    <input type="text" name="username" placeholder="Username" autocomplete="username" required>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" class="btn-secondary">Log in</button>
    <p id="login-error" class="empty" hidden>Invalid username or password.</p>
  </form>
</div>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const res = await fetch("/login", { method: "POST", body: form });
    if (res.ok) {
      window.location = "/";
    } else {
      document.getElementById("login-error").hidden = false;
    }
  });
</script>

{% endblock %}
