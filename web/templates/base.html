<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Pancracio Ideas{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand"><img src="/static/pancracio-logo.png" alt="Pancracio" class="brand-logo"> Pancracio Ideas</a>
    <nav class="nav-links">
      <a href="/dashboard" class="settings-link">Dashboard</a>
      <a href="/queue" class="settings-link">Queue</a>
      <a href="/stats" class="settings-link">Stats</a>
      <a href="/settings" class="settings-link">Settings</a>
      {% if request.state.user %}
      <span class="settings-link">logged in as {{ request.state.user.username }}</span>
      <a href="#" id="logout-link" class="settings-link">Log out</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% if request.state.user %}
  <script>
    document.getElementById("logout-link").addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/logout", { method: "POST" });
      window.location = "/login";
    });
  </script>
  {% endif %}
</body>
</html>
